# The lint gate for this repo. CI runs this file verbatim, so a local pass and
# a CI pass can never disagree.
#
# - actionlint: workflow syntax, expression types, and shellcheck over `run:`
# - zizmor:     GitHub Actions security audits, configured in `zizmor.yml`

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending

  # actionlint shells out to `shellcheck` for `run:` blocks when it is on PATH.
  # CI runners ship it; a local machine may not, and then a local pass can miss
  # what CI catches. `brew install shellcheck` to get the same result here.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # points at the same policy the `workflow-lint` action ships to every other
  # repo, so this repo cannot be linted by a different one than it publishes.
  # (zizmor has no `extends`, so the path is given rather than a second file.)
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--config, actions/workflow-lint/zizmor.yml]
