# The lint gate for this repo. CI runs this file verbatim, so a local pass and
# a CI pass can never disagree.
#
# - actionlint: workflow syntax, expression types, and shellcheck over `run:`
# - zizmor:     GitHub Actions security audits, configured in `zizmor.yml`

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
