# Decides which tag a release run releases, creating it when a merge asks for one.
#
#   push to main  ->  read #major/#minor/#patch from the title of the pull
#                     request the pushed commit merged, push the next tag,
#                     output it. No keyword (or #none), or no pull request (a
#                     direct push), releases nothing.
#   push of a tag ->  output that tag as-is, so a tag pushed by hand releases.
#
# Only the title counts, never commit messages, so a squash, rebase or merge
# commit of the same pull request releases the same version.
#
# Nothing is committed: the tag alone is the version. Python projects read it
# with setuptools_scm, and Rust projects write it into Cargo.toml at build time
# with `stamp-cargo-version`.
#
# It runs on `push` rather than on a closed pull request because GitHub gives a
# pull_request run from a fork a read-only token, even once it is merged, so the
# tag push fails with a 403. The pull request is found from the pushed commit.
#
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so everything
# that releases the tag has to run in the same workflow as this action.

name: Version bump
description: Resolve the tag to release, pushing a new one when a merged pull request's title asks for it.

inputs:
  token:
    description: "Needs `contents: write` to push the tag and read pull requests. Defaults to the job's own token."
    default: ${{ github.token }}

outputs:
  version:
    description: "Tag to release, eg. v1.2.3. Empty when there is nothing to release."
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - id: resolve
      name: Resolve version
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { owner, repo } = context.repo;
          const release = (version, why) => {
            core.info(`version: ${version || '(nothing to release)'}${why ? ` (${why})` : ''}`);
            core.setOutput('version', version);
          };
          if (context.ref.startsWith('refs/tags/')) {
            return release(context.ref.slice('refs/tags/'.length), 'pushed tag');
          }

          // the closed-pull-request path stays supported until every caller has
          // moved to `push`: its event carries the title and the merge commit
          const closed = context.payload.pull_request;
          const sha = closed?.merge_commit_sha || context.sha;
          let title = closed?.title;
          if (!title) {
            // the pull request whose merge put the commit on the default branch. A
            // squash or rebase merge's merge_commit_sha is the commit it left on
            // top, which is the one pushed; other pull requests that merely
            // contain the commit are left out.
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: sha,
            });
            title = pulls.find((pr) => pr.merged_at && pr.merge_commit_sha === sha)?.title;
          }
          if (!title) {
            return release('', `no pull request merged ${sha}`);
          }
          core.info(`pull request: ${title}`);

          // the largest keyword in the title wins
          const parts = ['major', 'minor', 'patch'];
          const bump = parts.findIndex((part) => title.includes(`#${part}`));
          if (bump < 0) {
            return release('', 'no #major/#minor/#patch in the title');
          }

          // the highest release tag (v0.0.0 if none); pre-releases (v1.2.3-rc1)
          // are not bumped from
          const refs = await github.paginate(github.rest.git.listMatchingRefs, {
            owner, repo, ref: 'tags/v',
          });
          const last = refs
            .map(({ ref }) => /^refs\/tags\/v(\d+)\.(\d+)\.(\d+)$/.exec(ref))
            .filter(Boolean)
            .map((match) => match.slice(1).map(Number))
            .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2])
            .at(-1) ?? [0, 0, 0];
          const next = last.map((n, i) => (i < bump ? n : i === bump ? n + 1 : 0));
          const version = `v${next.join('.')}`;
          core.info(`bump: ${parts[bump]} from v${last.join('.')}`);

          // a lightweight tag on the merged commit, as `git tag` makes
          await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${version}`, sha });
          release(version);
