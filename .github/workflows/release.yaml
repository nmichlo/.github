# Reusable release workflow: version bump, GitHub Release, and optional PyPI publish.
#
# Callers trigger it on BOTH of these, and must pass both through:
#   pull_request: {types: [closed], branches: [main]}   -> compute + push the next tag
#   push:         {tags: ['v*.*.*']}                    -> release the tag as-is
#
# Why one workflow rather than two:
#   Tags pushed with GITHUB_TOKEN do not trigger other workflows. A split
#   (version-bump -> publish-on-tag) can therefore never publish on a merge --
#   the bump creates the tag and nothing reacts to it. Owning both triggers here
#   fixes that without a PAT. A tag this workflow pushes does not re-enter it, so
#   there is no loop; a tag a human pushes does.
#
# Bumping is keyword-driven: put #major, #minor, #patch or #none in the PR title
# (it lands in the merge commit message). Without one, `default-bump` applies.

name: release

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python used to build the distribution."
        type: string
        default: "3.12"
      publish:
        description: "Publish to PyPI. Set false for applications that are not packages."
        type: boolean
        default: true
      default-bump:
        description: "Bump applied when the merge commit has no #major/#minor/#patch keyword."
        type: string
        default: "patch"
    secrets:
      PYPI_TOKEN:
        description: "Required when `publish` is true."
        required: false

jobs:
  # Only on a real merge. Skipped for tag pushes (the tag is already the version)
  # and for PRs closed without merging.
  version-bump:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.vtag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: "0"  # the action reads history to find the last tag

      - name: Bump version and push tag
        id: vtag
        # pinned to 1.71.0
        uses: anothrNick/github-tag-action@f278d49d30cdd8775cc3e7dd00b5ee11686ee297
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: ${{ inputs.default-bump }}
          WITH_V: true

  # Single source of the version for everything downstream, from whichever
  # trigger fired.
  resolve-version:
    needs: [version-bump]
    # always() is required, or this auto-skips whenever version-bump is skipped
    if: |
      always() &&
      (needs.version-bump.result == 'success' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.version-bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  # Draft, so a failed publish never leaves a visible release pointing at a
  # version that is not on the index.
  create-release:
    needs: [resolve-version]
    if: always() && needs.resolve-version.result == 'success' && needs.resolve-version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release (draft)
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          draft: true
          generate_release_notes: true

  publish:
    needs: [resolve-version, create-release]
    if: always() && inputs.publish && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # check out the tag itself, with full history: setuptools_scm derives the
      # version from the newest reachable tag, so a shallow clone builds 0.0.0
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.version }}
          fetch-depth: "0"

      # pinned exactly: astral-sh stopped publishing floating major
      # tags after v6, so `@v10` does not resolve
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: ${{ inputs.python-version }}

      - name: Build and Publish
        run: |
          uv build
          uv publish --username="__token__" --password="${{ secrets.PYPI_TOKEN }}"

  # Undraft once the package is actually published. If publish fails the draft
  # stays put -- fix the cause and use "Re-run failed jobs". When `publish` is
  # false the job is skipped, which still counts as success here.
  finalize-release:
    needs: [create-release, publish]
    if: |
      always() &&
      needs.create-release.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release (undraft)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
