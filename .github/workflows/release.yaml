# Reusable release workflow: version bump, GitHub Release, and optional PyPI publish.
#
# Callers trigger it on both of these, and must pass both through:
#   push: {branches: [main]}    -> push the next tag, if the merge asks for one
#   push: {tags: ['v*.*.*']}    -> release the tag as-is
#
# Why one workflow rather than two:
#   Tags pushed with GITHUB_TOKEN do not trigger other workflows. A split
#   (version-bump -> publish-on-tag) can therefore never publish on a merge --
#   the bump creates the tag and nothing reacts to it. Owning both triggers here
#   fixes that without a PAT. A tag this workflow pushes does not re-enter it, so
#   there is no loop; a tag a human pushes does.
#
# Bumping is keyword-driven: put #major, #minor or #patch in the PR title (a
# squash merge puts it in the commit message). Without one nothing is released.
#
# This workflow does NOT publish to PyPI. PyPI's trusted publishing matches the
# `job_workflow_ref` OIDC claim, which names the file a job is WRITTEN in -- from
# here that reads `nmichlo/.github`, which can never match the calling project.
# Reusable workflows are unsupported on PyPI's side (pypa/gh-action-pypi-publish
# #166), so each caller owns a `python-publish` job. See the README.

name: release

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python used to build the distribution."
        type: string
        default: "3.12"
      publish:
        description: >
          True when the CALLER owns a publish job. This workflow then leaves the
          GitHub release as a draft for that job to finish. False for
          applications that are not published anywhere, which get a finished
          release immediately.
        type: boolean
        default: true
    outputs:
      version:
        description: "The tag that was released, eg. v1.2.3. Empty when nothing was released."
        value: ${{ jobs.version.outputs.version }}

jobs:
  # The tag this run releases: a new one on a merge that asks for it, the pushed
  # one on a tag push, empty otherwise. See `actions/version-bump`.
  version:
    # a pull request closed without merging has nothing to release. (that event
    # is only still accepted until every caller has moved to `push`.)
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        uses: nmichlo/.github/actions/version-bump@main

  # Drafted when the caller publishes, so a failed upload never leaves a visible
  # release pointing at a version that is not on the index. The caller's publish
  # job undrafts it. When nothing is published there is nothing to wait for, so
  # the release is finished here.
  create-release:
    needs: [version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # persist-credentials: false -- checkout otherwise leaves the job's token in
      # .git/config, where any later step (or a dependency's build script) can read
      # it. only the version-bump action, which pushes, keeps it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create GitHub Release (draft)
        id: release
        # zizmor: ignore[superfluous-actions] -- `gh release create` cannot
        # generate release notes from the previous tag, which is the only reason
        # this step exists rather than a one-line script.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          draft: ${{ inputs.publish }}
          generate_release_notes: true
