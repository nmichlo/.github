# Reusable release workflow: version bump, GitHub Release, and optional PyPI publish.
#
# Callers trigger it on BOTH of these, and must pass both through:
#   pull_request: {types: [closed], branches: [main]}   -> compute + push the next tag
#   push:         {tags: ['v*.*.*']}                    -> release the tag as-is
#
# Why one workflow rather than two:
#   Tags pushed with GITHUB_TOKEN do not trigger other workflows. A split
#   (version-bump -> publish-on-tag) can therefore never publish on a merge --
#   the bump creates the tag and nothing reacts to it. Owning both triggers here
#   fixes that without a PAT. A tag this workflow pushes does not re-enter it, so
#   there is no loop; a tag a human pushes does.
#
# Bumping is keyword-driven: put #major, #minor, #patch or #none in the PR title
# (it lands in the merge commit message). Without one, `default-bump` applies.
#
# This workflow does NOT publish to PyPI. PyPI's trusted publishing matches the
# `job_workflow_ref` OIDC claim, which names the file a job is WRITTEN in -- from
# here that reads `nmichlo/.github`, which can never match the calling project.
# Reusable workflows are unsupported on PyPI's side (pypa/gh-action-pypi-publish
# #166), so each caller owns a `python-publish` job. See the README.

name: release

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python used to build the distribution."
        type: string
        default: "3.12"
      publish:
        description: >
          True when the CALLER owns a publish job. This workflow then leaves the
          GitHub release as a draft for that job to finish. False for
          applications that are not published anywhere, which get a finished
          release immediately.
        type: boolean
        default: true
      default-bump:
        description: "Bump applied when the merge commit has no #major/#minor/#patch keyword."
        type: string
        default: "patch"
    outputs:
      version:
        description: "The tag that was released, eg. v1.2.3. Empty when nothing was released."
        value: ${{ jobs.resolve-version.outputs.version }}

jobs:
  # Only on a real merge. Skipped for tag pushes (the tag is already the version)
  # and for PRs closed without merging.
  version-bump:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.vtag.outputs.new_tag }}
    steps:
      # keeps its credentials on purpose: the tag action below pushes with them.
      - uses: actions/checkout@v7  # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: "0"  # the action reads history to find the last tag

      - name: Bump version and push tag
        id: vtag
        # pinned to 1.71.0
        uses: anothrNick/github-tag-action@f278d49d30cdd8775cc3e7dd00b5ee11686ee297
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: ${{ inputs.default-bump }}
          WITH_V: true

  # Single source of the version for everything downstream, from whichever
  # trigger fired.
  resolve-version:
    needs: [version-bump]
    # always() is required, or this auto-skips whenever version-bump is skipped
    if: |
      always() &&
      (needs.version-bump.result == 'success' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # context values go through `env:` rather than straight into `run:`.
      # `${{ }}` is textual substitution into the script, so a ref name
      # containing shell metacharacters would otherwise be executed.
      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMPED_VERSION: ${{ needs.version-bump.outputs.version }}
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${BUMPED_VERSION}" >> "$GITHUB_OUTPUT"
          fi

  # Drafted when the caller publishes, so a failed upload never leaves a visible
  # release pointing at a version that is not on the index. The caller's publish
  # job undrafts it. When nothing is published there is nothing to wait for, so
  # the release is finished here.
  create-release:
    needs: [resolve-version]
    if: always() && needs.resolve-version.result == 'success' && needs.resolve-version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # persist-credentials: false -- checkout otherwise leaves the job's token in
      # .git/config, where any later step (or a dependency's build script) can read
      # it. only the version-bump jobs, which push, keep it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create GitHub Release (draft)
        id: release
        # zizmor: ignore[superfluous-actions] -- `gh release create` cannot
        # generate release notes from the previous tag, which is the only reason
        # this step exists rather than a one-line script.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          draft: ${{ inputs.publish }}
          generate_release_notes: true
