# Reusable test workflow.

name: pytest

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to matrix over, eg. ["3.12", "3.13"].'
        type: string
        default: '["3.12"]'
      install-extras:
        description: >
          Extras to install, as the bracket part of `pip install -e ".[...]"`.
          Empty means no extras.
        type: string
        default: "test"
      pytest-args:
        description: >
          Extra pytest flags. Split on whitespace, so no value here may contain
          a space -- quoting does NOT survive. Use `markers` for `-m`.
        type: string
        default: "--color=yes --verbose"
      markers:
        description: >
          A marker expression for `-m`, eg. "not extra_test". Its own input
          because it is the one argument that legitimately contains spaces.
        type: string
        default: ""
      rust:
        description: "Build a maturin extension before testing."
        type: boolean
        default: false
      coverage:
        description: >
          Package to measure coverage for, eg. "disent". Empty disables coverage
          and the codecov upload. Requires pytest-cov in the installed extras.
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # codecov OIDC upload
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      # persist-credentials: false -- checkout otherwise leaves the job's token in
      # .git/config, where any later step (or a dependency's build script) can read
      # it. only the version-bump jobs, which push, keep it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: inputs.rust
        uses: dtolnay/rust-toolchain@stable
      - if: inputs.rust
        uses: Swatinem/rust-cache@v2

      # pinned exactly: astral-sh stopped publishing floating major
      # tags after v6, so `@v10` does not resolve
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # a venv rather than `--system`: the runner's python is externally managed
      # (PEP 668), so `uv pip install --system` refuses to touch it. `--clear`
      # because setup-uv already made a `.venv` when given a `python-version`.
      # inputs go through `env:` rather than straight into `run:`. a caller
      # controls them, and `${{ }}` is textual substitution into the script --
      # an input containing a quote would otherwise splice in shell of its own.
      - name: Create venv
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv venv --python "${PYTHON_VERSION}" --clear .venv

      - name: Install
        env:
          INSTALL_EXTRAS: ${{ inputs.install-extras }}
        run: |
          if [ -n "${INSTALL_EXTRAS}" ]; then
            uv pip install --python .venv -e ".[${INSTALL_EXTRAS}]"
          else
            uv pip install --python .venv -e .
          fi

      - if: inputs.rust
        name: Build extension
        run: uv run --no-project --python .venv maturin develop --release

      # `pytest-args` arrives as an environment variable, not as text spliced
      # into this script, so shell quoting inside it is NOT re-parsed: a value
      # of `-m 'not extra_test'` would split into `-m`, `'not`, `extra_test'`
      # and pytest would look for a file named `extra_test'`. Hence `markers`
      # being a separate input -- it is quoted here, once, correctly.
      - name: Run pytest
        env:
          COVERAGE: ${{ inputs.coverage }}
          MARKERS: ${{ inputs.markers }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: |
          read -r -a args <<< "${PYTEST_ARGS}"
          if [ -n "${COVERAGE}" ]; then
            args=(--cov="${COVERAGE}" "${args[@]}")
          fi
          if [ -n "${MARKERS}" ]; then
            args+=(-m "${MARKERS}")
          fi
          echo "pytest ${args[*]}"
          .venv/bin/pytest "${args[@]}"

      # codecov merges all uploaded files, so every matrix entry can upload.
      # never blocks the build -- a coverage upload failing is not a test failure.
      #
      # `use_oidc` rather than a token: there is no CODECOV_TOKEN in any of these
      # repos. Unlike PyPI, codecov has no reusable-workflow restriction -- it
      # verifies the token against GitHub's JWKS and the `repository` claim, not
      # a pre-registered workflow filename, so this works from here.
      - if: inputs.coverage != ''
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          fail_ci_if_error: false
