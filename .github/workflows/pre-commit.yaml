# Reusable lint workflow.
#
# Runs `.pre-commit-config.yaml` verbatim, so `pre-commit run --all-files`
# locally and CI can never disagree. Tool config lives in the caller's
# `pyproject.toml`; hook versions are pinned in its `.pre-commit-config.yaml`.

name: pre-commit

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python used for the project venv."
        type: string
        default: "3.12"
      install-extras:
        description: >
          Extras to install, as the bracket part of `pip install -e ".[...]"`.
          The `ty` hook needs the project's dependencies resolvable to check
          anything useful, and it auto-detects `.venv`. Empty means no extras.
        type: string
        default: ""
      rust:
        description: "Install a Rust toolchain first, for repos with cargo hooks."
        type: boolean
        default: false
      install:
        description: >
          Install the project into `.venv` before running the hooks. Only needed
          when a hook imports the package -- `ty` does, `ruff` and cargo do not.
        type: boolean
        default: true
      workflow-lint:
        description: >
          Run actionlint and zizmor over `.github/workflows`. Off only for a
          repo still working through its findings.
        type: boolean
        default: true
      skip-hooks:
        description: >
          Comma-separated hook ids to skip, passed to pre-commit as SKIP. For
          hooks that need system libraries this job does not install, and which
          therefore run in a better-equipped workflow instead.
        type: string
        default: ""

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false -- checkout otherwise leaves the job's token in
      # .git/config, where any later step (or a dependency's build script) can read
      # it. only the version-bump jobs, which push, keep it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: inputs.rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # pinned exactly: astral-sh stopped publishing floating major
      # tags after v6, so `@v10` does not resolve
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `--clear` because setup-uv may already have made a `.venv`, and
      # `uv venv` refuses to overwrite one.
      # inputs go through `env:` rather than straight into `run:`. a caller
      # controls them, and `${{ }}` is textual substitution into the script --
      # an input containing a quote would otherwise splice in shell of its own.
      - if: inputs.install
        name: Install project into .venv
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
          INSTALL_EXTRAS: ${{ inputs.install-extras }}
        run: |
          uv venv --python "${PYTHON_VERSION}" --clear .venv
          if [ -n "${INSTALL_EXTRAS}" ]; then
            uv pip install --python .venv -e ".[${INSTALL_EXTRAS}]"
          else
            uv pip install --python .venv -e .
          fi

      - name: Run pre-commit
        env:
          SKIP: ${{ inputs.skip-hooks }}
        run: uvx --from pre-commit pre-commit run --all-files --show-diff-on-failure

      # actionlint + zizmor live here rather than in every repo's
      # `.pre-commit-config.yaml`, so bumping either is one commit in this repo
      # instead of nine pull requests. The trade-off is deliberate: a local
      # `pre-commit run --all-files` does NOT cover workflow files, only CI does.
      - if: inputs.workflow-lint
        uses: nmichlo/.github/actions/workflow-lint@main
