# Reusable release workflow for maturin (Rust + Python) projects.
#
# Callers trigger it on both of these, and must pass both through:
#   push: {branches: [main]}    -> push the next tag, if the merge asks for one
#   push: {tags: ['v*']}        -> release the tag as-is
#
# Why one workflow rather than two:
#   Tags pushed with GITHUB_TOKEN do not trigger other workflows, so a separate
#   bump workflow could never start this one. Owning both triggers here fixes
#   that without a PAT. A tag this workflow pushes does not re-enter it.
#
# The tag is the only version. The committed Cargo.toml holds a 0.0.0
# placeholder, and every job that builds or publishes writes the tag's version
# into it first (`actions/stamp-cargo-version`). Nothing is committed back.
#
# Why maturin projects cannot use the plain `release.yaml`:
#   wheels need a per-platform build matrix, and publishing can go to two
#   indexes over OIDC.
#
# Bumping is keyword-driven: put #major, #minor or #patch in the PR title.
# Without one nothing is released.

name: release-rust

on:
  workflow_call:
    inputs:
      package-name:
        description: "PyPI project name, used for the deployment environment URL."
        type: string
        required: true
      python-version:
        description: "Python used to build the wheels."
        type: string
        default: "3.12"
      crates-io:
        description: "Also publish the crate to crates.io over OIDC."
        type: boolean
        default: true
    outputs:
      version:
        description: "The tag that was released, eg. v1.2.3. Empty when nothing was released."
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: write  # For creating GitHub releases

jobs:
  # The tag this run releases: a new one on a merge that asks for it, the pushed
  # one on a tag push, empty otherwise. See `actions/version-bump`.
  version:
    # a pull request closed without merging has nothing to release. (that event
    # is only still accepted until every caller has moved to `push`.)
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        uses: nmichlo/.github/actions/version-bump@main

  python-build:
    needs: [version]
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          # Linux
          - { python-version: "${{ inputs.python-version }}", runs-on: "ubuntu-latest", target: "x86_64" }
          - { python-version: "${{ inputs.python-version }}", runs-on: "ubuntu-latest", target: "aarch64" }
          # Windows (no aarch64 cross-compile support)
          - { python-version: "${{ inputs.python-version }}", runs-on: "windows-latest", target: "x86_64" }
          # macOS
          - { python-version: "${{ inputs.python-version }}", runs-on: "macos-15-intel", target: "x86_64" }
          - { python-version: "${{ inputs.python-version }}", runs-on: "macos-15", target: "aarch64" }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.version }}
      - uses: nmichlo/.github/actions/stamp-cargo-version@main
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release -i python${{ matrix.python-version }} --out dist
          sccache: true
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}-${{ matrix.runs-on }}-${{ matrix.target }}
          path: dist

  python-sdist:
    needs: [version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.version }}
      - uses: nmichlo/.github/actions/stamp-cargo-version@main
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # NOTE: there is deliberately no PyPI publish job here. PyPI matches the
  # `job_workflow_ref` OIDC claim, which names the file a job is WRITTEN in, not
  # the workflow the event triggered:
  #
  #   workflow_ref      nmichlo/norfair-rs/.github/workflows/release.yml
  #   job_workflow_ref  nmichlo/.github/.github/workflows/release-rust.yaml
  #                     ^ what PyPI checks, and it can never name this repo
  #
  # and PyPI builds the expected value from the publisher's own repository, so
  # no configuration satisfies both claims at once. Reusable workflows are
  # unsupported there; see pypa/gh-action-pypi-publish#166. The caller therefore
  # owns its own `python-publish` job, which downloads the `wheels-*` artifacts
  # this workflow uploads. crates.io is unaffected -- it matches `workflow_ref`.

  # https://crates.io/docs/trusted-publishing
  rust-publish:
    name: Publish to crates.io
    needs: [version]
    runs-on: ubuntu-latest
    if: inputs.crates-io && needs.version.outputs.version != ''
    environment: release  # Optional: for enhanced security
    permissions:
      id-token: write     # Required for OIDC token exchange
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.version }}
      - uses: nmichlo/.github/actions/stamp-cargo-version@main
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # --allow-dirty: the stamped Cargo.toml is deliberately uncommitted.
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Create GitHub Release with artifacts
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, python-build, python-sdist, rust-publish]
    if: |
      always() &&
      needs.python-build.result == 'success' &&
      needs.python-sdist.result == 'success' &&
      (needs.rust-publish.result == 'success' || needs.rust-publish.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        # zizmor: ignore[superfluous-actions] -- `gh release create` is the
        # suggested replacement, but this step's `id` output feeds the undraft
        # job, and `gh` does not return one.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
