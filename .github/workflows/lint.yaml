# This repo's own lint gate. It dogfoods the reusable workflow it publishes.

name: lint

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

permissions:
  contents: read

jobs:
  pre-commit:
    # zizmor wants the newer `$/...` self-repository form, but actionlint
    # v1.7.12 predates it (released 2026-03-30, the feature landed 2026-07-30)
    # and rejects it outright. revisit when actionlint catches up.
    uses: ./.github/workflows/pre-commit.yaml  # zizmor: ignore[self-repository]
    with:
      # nothing to install -- this repo is yaml, not a python package
      install: false

  # The branch-protection gate; see actions/gate for why it exists. `always()`
  # is required, or the gate is skipped when what it guards fails -- and a
  # skipped required check counts as success.
  lint:
    needs: [pre-commit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # a local action ref needs the repo on disk first. other repos use
      # `nmichlo/.github/actions/gate@main`, which is fetched automatically and
      # needs no checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./actions/gate  # zizmor: ignore[self-repository]
        with:
          needs: ${{ toJSON(needs) }}
